[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia-nexus"
version = "0.5.2"
description = "A local-first scientific knowledge acquisition infrastructure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.60,<5",
    "httpx>=0.27,<1",
    "pypdf[crypto]>=6.14,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
