[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia-nexus"
version = "0.6.0"
description = "A local-first scientific knowledge acquisition infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fonttools>=4.60,<5",
    "httpx>=0.27,<1",
    "pypdf[crypto]>=6.14,<7",
]

[project.urls]
Homepage = "https://github.com/shenxuekairui/aletheia-nexus"
Documentation = "https://github.com/shenxuekairui/aletheia-nexus/blob/main/docs/USER_MANUAL.md"
Issues = "https://github.com/shenxuekairui/aletheia-nexus/issues"

[project.optional-dependencies]
browser = [
    "playwright>=1.63,<2",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
