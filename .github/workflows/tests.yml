name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
  merge_group:
  workflow_dispatch:
    inputs:
      tier:
        description: Run only the fast suite or the complete release gate
        required: true
        default: full
        type: choice
        options: [fast, full]

# Superseded PR and main commits do not need to finish. Merge-queue and manual
# release checks are never cancelled by an unrelated push.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (3.11)
    # A ci:full label is a one-shot, opt-in cloud check on a draft PR. Ordinary
    # draft commits and unrelated label events allocate no runner.
    if: >-
      github.event_name != 'pull_request' ||
      !github.event.pull_request.draft ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Check dependencies, style and syntax
        run: |
          python -m pip check
          python -m ruff format --check src tests scripts
          python -m ruff check src tests scripts
          python -m compileall -q src scripts
          python scripts/verify_frozen_benchmark.py
      - name: Run frozen parser qualification
        run: python scripts/evaluate_v07_parser.py --output parser-evaluation.json
      - name: Upload parser qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: parser-evaluation-${{ github.sha }}
          path: parser-evaluation.json
          if-no-files-found: error
          retention-days: 30
      - name: Run deterministic suite
        run: python -m pytest -q

  compatibility:
    name: test (${{ matrix.python-version }})
    needs: test
    if: >-
      (github.event_name != 'pull_request' ||
       !github.event.pull_request.draft ||
       (github.event.action == 'labeled' && github.event.label.name == 'ci:full')) &&
      (github.event_name != 'workflow_dispatch' || inputs.tier == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Run deterministic compatibility suite
        run: python -m pytest -q

  package:
    name: package + clean wheel
    needs: test
    if: >-
      (github.event_name != 'pull_request' ||
       !github.event.pull_request.draft ||
       (github.event.action == 'labeled' && github.event.label.name == 'ci:full')) &&
      (github.event_name != 'workflow_dispatch' || inputs.tier == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build and verify distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install pytest dist/*.whl
          smoke-venv/bin/python -m pip check
          smoke-venv/bin/aletheia-nexus --version
          smoke-venv/bin/aletheia-nexus doctor
          smoke-venv/bin/python -m pytest -q tests/test_cli.py tests/test_library.py tests/content

  browser-extra:
    name: browser-extra
    needs: test
    if: >-
      (github.event_name != 'pull_request' ||
       !github.event.pull_request.draft ||
       (github.event.action == 'labeled' && github.event.label.name == 'ci:full')) &&
      (github.event_name != 'workflow_dispatch' || inputs.tier == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and browser extra
        run: python -m pip install -e ".[dev,browser]"
      - name: Check dependencies
        run: python -m pip check
      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Provision fixed persistent-download browser
        run: python scripts/install_an_browser.py
      - name: Verify sandboxed Linux browser startup
        env:
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import stat
          import subprocess
          import tempfile
          from aletheia_nexus.acquire.access.browser_engine.runtime import fixed_portable_browser

          helper = Path(os.environ['CHROME_DEVEL_SANDBOX']).stat()
          assert helper.st_uid == 0 and helper.st_mode & stat.S_ISUID, 'A root-owned Chrome sandbox helper is required'
          executable = fixed_portable_browser()
          assert executable is not None, 'The fixed browser must be installed first'
          with tempfile.TemporaryDirectory(prefix='an-sandbox-check-') as profile:
              subprocess.run([str(executable), '--headless=new', '--no-first-run',
                              f'--user-data-dir={profile}', '--dump-dom', 'about:blank'],
                             check=True, timeout=30)
          PY
      - name: Run local real-Chromium integration tests
        env:
          AN_RUN_BROWSER_SMOKE: "1"
          AN_RUN_VISIBLE_BROWSER_SMOKE: "1"
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
        run: xvfb-run -a python -m pytest -q tests/acquire/access/test_browser_integration.py tests/acquire/access/test_cnki_browser_integration.py tests/acquire/access/test_normal_browser_integration.py

  ocr-extra:
    name: ocr-extra (Poppler + Tesseract)
    needs: test
    if: >-
      (github.event_name != 'pull_request' ||
       !github.event.pull_request.draft ||
       (github.event.action == 'labeled' && github.event.label.name == 'ci:full')) &&
      (github.event_name != 'workflow_dispatch' || inputs.tier == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install OCR executables and project
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          python -m pip install -e ".[dev,ocr]"
      - name: Check dependencies and real raster-only OCR path
        env:
          AN_RUN_OCR_SMOKE: "1"
        run: |
          python -m pip check
          pdftoppm -v
          tesseract --version
          python -m pytest -q tests/content/test_ocr_integration.py

  windows:
    name: windows (3.11 + Chromium)
    needs: test
    if: >-
      (github.event_name != 'pull_request' ||
       !github.event.pull_request.draft ||
       (github.event.action == 'labeled' && github.event.label.name == 'ci:full')) &&
      (github.event_name != 'workflow_dispatch' || inputs.tier == 'full')
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and browser extra
        run: python -m pip install -e ".[dev,browser]"
      - name: Check dependencies and installed CLI
        run: |
          python -m pip check
          aletheia-nexus --version
          aletheia-nexus doctor
      - name: Run deterministic suite on Windows
        run: python -m pytest -q
      - name: Install Chromium runtime
        run: python -m playwright install chromium
      - name: Provision fixed persistent-download browser
        run: python scripts/install_an_browser.py
      - name: Run real-Chromium integration tests on Windows
        env:
          AN_RUN_BROWSER_SMOKE: "1"
          AN_RUN_VISIBLE_BROWSER_SMOKE: "1"
        run: python -m pytest -q tests/acquire/access/test_browser_integration.py tests/acquire/access/test_cnki_browser_integration.py tests/acquire/access/test_normal_browser_integration.py
