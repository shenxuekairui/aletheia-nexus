name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check formatting
        run: ruff format --check .

      - name: Run static checks
        run: ruff check .

      - name: Check source and runner syntax
        run: python -m compileall -q src scripts

      - name: Run tests
        run: python -m pytest -q


  browser-extra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install browser extra
        run: python -m pip install -e ".[dev,browser]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Smoke test real Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content("<title>AN browser smoke</title><main>ok</main>")
              assert page.title() == "AN browser smoke"
              assert page.locator("main").inner_text() == "ok"
              browser.close()
          PY

      - name: Run access-layer tests
        env:
          AN_RUN_BROWSER_SMOKE: "1"
        run: python -m pytest -q tests/acquire/access
