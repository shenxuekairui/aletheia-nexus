name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}' or '.dev' in version:
              raise SystemExit(f'Release tag {tag!r} does not match final version {version!r}')
          PY
      - name: Test and build distributions
        run: |
          python -m pip install ".[dev]" build twine
          python -m pytest -q
          python -m build
          python -m twine check dist/*
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install dist/*.whl
          smoke-venv/bin/aletheia-nexus --version
          smoke-venv/bin/aletheia-nexus doctor
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
